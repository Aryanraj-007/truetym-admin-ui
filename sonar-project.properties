sonar.projectKey=Truetym_nextjs-template
sonar.organization=truetym

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=nextjs-template
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.

# Test coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Next.js specific configuration
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Include all JavaScript and TypeScript files for analysis
sonar.inclusions=**/*.js,**/*.jsx,**/*.ts,**/*.tsx
sonar.tests=.
sonar.test.inclusions=**/__tests__/**, **/cypress/**, **/*.test.ts, **/*.test.js, **/*.test.tsx, **/*.test.jsx

# Exclude build artifacts, non-source directories, and specific files
sonar.exclusions=**/*.config.ts, **/*.config.js, **/*.setup.ts, **/*.setup.js, .lintstagedrc.js, **/components/ui/**/*
